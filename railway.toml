# Railway: https://docs.railway.app/reference/config-as-code
# Build: Dockerfile installs OS deps (poppler, tesseract) + pip from requirements.txt
# Start: fixed port 8000 (see Dockerfile CMD and deploy.startCommand).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m uvicorn api.workflow_app:app --host 0.0.0.0 --port 8000"
healthcheckPath = "/api/system/customer-web-status"
healthcheckTimeout = 120
