# Railway: https://docs.railway.app/reference/config-as-code
# Build: Dockerfile installs OS deps (poppler, tesseract) + pip from requirements.txt
# Start: bind 0.0.0.0; Railway sets PORT (fallback 8000 for local Docker).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Shell expands PORT (Railway sets it); ${PORT:-8000} for local Docker runs without PORT.
startCommand = "python -m uvicorn api.workflow_app:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/api/system/customer-web-status"
healthcheckTimeout = 120
# Home waitlist + live demo: add service variable PUBLIC_DEMO_ENABLED=1 when running as
# production-like (ENVIRONMENT=production or REPLIT_DEPLOYMENT=1). Probe publicDemo.ready at
# GET /api/system/customer-web-status after deploy.
