# Railway: https://docs.railway.app/reference/config-as-code
# Build: Dockerfile installs OS deps (poppler, tesseract) + pip from requirements.txt
# Start: bind 0.0.0.0; Railway sets PORT (fallback 8000 for local Docker).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway runs this without a shell unless we wrap it — uvicorn must receive a numeric --port.
# sh expands PORT; ${PORT:-8000} when PORT is unset (e.g. local docker run).
startCommand = "/bin/sh -c 'exec python -m uvicorn api.workflow_app:app --host 0.0.0.0 --port ${PORT:-8000}'"
# Minimal probe: no DB/demo work on request path — succeeds once lifespan + DB init finished.
healthcheckPath = "/health"
healthcheckTimeout = 120
# Full stack + SPA/dist + public demo status: GET /api/system/customer-web-status (after deploy).
