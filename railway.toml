# Railway: https://docs.railway.app/reference/config-as-code
# Build: Dockerfile installs OS deps (poppler, tesseract) + pip from requirements.txt
# Start: Dockerfile CMD runs uvicorn on $PORT (Railway injects PORT at runtime).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m uvicorn api.workflow_app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/system/customer-web-status"
healthcheckTimeout = 120
